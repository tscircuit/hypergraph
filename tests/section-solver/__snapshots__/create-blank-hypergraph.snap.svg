 fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="8" data-y="5.3" cx="320" cy="226.66666666666669" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="6" data-y="4" cx="181.7283950617284" cy="316.5432098765432" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="10" data-y="4" cx="458.2716049382716" cy="316.5432098765432" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="8" data-y="2" cx="320" cy="454.8148148148148" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="12" data-y="2.8" cx="596.5432098765432" cy="399.5061728395061" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="12" data-y="1.2" cx="596.5432098765432" cy="510.12345679012344" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="5.1" data-y="0" cx="119.50617283950618" cy="593.0864197530864" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="6.7" data-y="0" cx="230.1234567901235" cy="593.0864197530864" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="9.2" data-y="0" cx="402.96296296296293" cy="593.0864197530864" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><circle data-type="circle" data-label="" data-x="11.1" data-y="0" cx="534.3209876543209" cy="593.0864197530864" r="3.45679012345679" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.014464285714285716"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":69.1358024691358,"c":0,"e":-233.08641975308637,"b":0,"d":-69.1358024691358,"f":593.0864197530864};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
